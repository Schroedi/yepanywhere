name: iOS App CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/ios/**'
      - 'packages/mobile-core/**'
      - 'packages/mobile-core-proof/test-vectors/**'
      - 'packages/android/app/src/sharedTest/resources/**'
      - 'packages/client/**'
      - 'packages/server/**'
      - 'packages/relay/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ios-app-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/ios/**'
      - 'packages/mobile-core/**'
      - 'packages/mobile-core-proof/test-vectors/**'
      - 'packages/android/app/src/sharedTest/resources/**'
      - 'packages/client/**'
      - 'packages/server/**'
      - 'packages/relay/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ios-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ios-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ios-app:
    name: Rust, simulator, and device archive
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned native tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.97.0 aarch64-apple-ios aarch64-apple-ios-sim
          curl -fLsS https://github.com/yonaskolb/XcodeGen/releases/download/2.45.3/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/ya-xcodegen"
          echo "$RUNNER_TEMP/ya-xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Verify Rust profile and resource ownership
        run: node packages/mobile-core/scripts/run.mjs rust
      - name: Verify unchanged server and relay routes
        run: |
          node packages/mobile-core/scripts/live.mjs
          pnpm exec tsx --conditions source packages/mobile-core/scripts/live-relay.ts
      - name: Verify native web host descriptor
        run: pnpm --filter @yep-anywhere/client exec vitest run src/lib/__tests__/nativeHost.test.ts
      - name: Build and test on an owned simulator
        run: node packages/ios/scripts/run.mjs test
      - name: Link an unsigned physical-device build
        run: node packages/ios/scripts/run.mjs build
      - name: Upload simulator evidence and unsigned app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-build-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            packages/ios/build/*.xcresult
            packages/ios/build/host-*.json
            packages/ios/build/DerivedData/Build/Products/Release-iphoneos/YepAnywhere.app
