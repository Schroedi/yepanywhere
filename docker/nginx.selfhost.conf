# Static file server for the remote web client (SPA).
# The relay is exposed on its own domain, so no /ws or API proxying here —
# the browser connects to the relay directly (e.g. wss://yepr.keks.dev/ws).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index remote.html;

    # Serve files if they exist, otherwise fall back to the SPA entry point.
    # This also covers /assets, favicon, manifest, sw.js, etc.
    location / {
        try_files $uri $uri/ /remote.html;
    }
}
